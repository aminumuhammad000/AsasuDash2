<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ASASU Realty LTD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a1f3c;
    --navy-mid: #252b4a;
    --gold: #e8b84b;
    --white: #ffffff;
    --text-muted: rgba(255,255,255,0.5);
  }
  body, html { margin: 0; padding: 0; height: 100%; font-family: 'DM Sans', sans-serif; }
  .login-screen {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(232,184,75,0.2);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }
  .logo { font-family: 'Playfair Display', serif; color: var(--white); font-size: 24px; margin-bottom: 30px; }
  .form-group { text-align: left; margin-bottom: 20px; }
  .form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; }
  .form-input {
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--white);
    outline: none;
    box-sizing: border-box;
  }
  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-primary:hover { background: #f5d07a; }
  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }
  .password-wrapper input {
    padding-right: 45px !important;
  }
  .password-toggle-btn {
    position: absolute;
    right: 14px;
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    color: rgba(255, 255, 255, 0.6);
    transition: opacity 0.2s, color 0.2s;
    z-index: 10;
  }
  .password-toggle-btn:hover {
    color: var(--gold);
  }
</style>
</head>
<body>
<div class="login-screen">
  <div class="login-card">
    <div class="logo">ASASU REALTY LTD<br><span style="font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:2px">Admin Portal</span></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input type="text" id="adminUser" class="form-input" placeholder="admin">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="password-wrapper">
        <input type="password" id="adminPass" class="form-input" placeholder="••••••••">
        <span class="password-toggle-btn" id="adminPassToggle" onclick="togglePassword('adminPass', 'adminPassToggle')">👁️</span>
      </div>
    </div>
    <button class="btn-primary" onclick="loginAdmin()">Login to Admin Dashboard</button>
  </div>
</div>

<script>
function togglePassword(inputId, toggleId) {
  const input = document.getElementById(inputId);
  const toggle = document.getElementById(toggleId);
  if (input && toggle) {
    if (input.type === 'password') {
      input.type = 'text';
      toggle.textContent = '🙈';
    } else {
      input.type = 'password';
      toggle.textContent = '👁️';
    }
  }
}
const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : '/api';
async function loginAdmin() {
  const email = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPass').value.trim();

  try {
    const res = await fetch(`${API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    if (data.user.role !== 'admin') throw new Error('Access denied: Admins only');

    localStorage.setItem('token', data.token);
    localStorage.setItem('userName', data.user.name);
    localStorage.setItem('userRole', data.user.role);
    localStorage.setItem('userEmail', data.user.email);
    
    window.location.href = '/admin';
  } catch (err) {
    alert(err.message);
  }
}
</script>
</body>
</html>
