services:
  postgres:
    image: postgres:16-alpine
    container_name: asasu-postgres
    environment:
      POSTGRES_USER: asasu
      POSTGRES_PASSWORD: asasu
      POSTGRES_DB: asasu_commissions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: asasu-redis
    ports:
      - "6379:6379"
volumes:
  postgres-data:
